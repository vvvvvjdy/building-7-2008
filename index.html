<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#245edb"><meta name="description" content="打开一块旧硬盘，回到2008年的桌面。关于记忆、流言与真相的互动叙事游戏。">
<title>消失在2008的7号楼</title>
<link rel="stylesheet" href="./style.css?v=0.3">
</head>
<body>
<div class="desktop" id="desktop">
 <nav class="desktop-icons" aria-label="桌面快捷方式"></nav>
 <div class="desktop-mark" aria-hidden="true">跃进新村<br><small>最后的备份 · 2008</small></div>
 <main class="app-window" aria-label="游戏主窗口">
  <div class="window-bar" id="drag-handle"><span class="window-title" id="window-title"></span><div class="window-actions"><button data-action="minimize" aria-label="最小化游戏窗口" title="最小化">_</button><button data-action="maximize" aria-label="放大游戏窗口" aria-pressed="false" title="最大化 / 还原">□</button><button data-action="close-window" aria-label="关闭游戏窗口" title="关闭">×</button></div></div>
  <div id="screen" tabindex="-1"></div>
 </main>
 <div id="window-placeholder" class="window-placeholder" hidden><p>旧硬盘仍在这里。你的调查进度已保存。</p><button data-action="restore">打开档案窗口</button></div>
 <footer class="taskbar"><button class="start-pill" data-action="menu"><i class="win-flag" aria-hidden="true"><b></b><b></b><b></b><b></b></i>开始</button><button class="show-desktop" data-action="minimize" aria-label="显示桌面" title="显示桌面">▣</button><button class="task-item" data-action="restore"><span id="task-icon"></span><span id="task-label">旧硬盘 (E:)</span></button><span class="tray"><button data-action="settings" aria-label="声音与显示设置" title="声音与显示设置">♪</button><span>CH</span><button class="clock" data-action="timeline" title="调查时间线">23:59</button></span></footer>
</div>
<div id="dialog-root"></div><div id="toast" role="status" aria-live="polite"></div>
<script src="./interface.js?v=0.3" defer></script><script src="./game.js?v=0.3" defer></script>
</body></html>
